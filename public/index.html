@theme inline {

<script>
const WEB_MODE = typeof window !== 'undefined' && !!window.__SLOTH_WEB;   // true only in the standalone website build
const hostKind = () => WEB_MODE ? 'web' : (typeof window !== 'undefined' && window.claude ? 'claude' : 'static');   // static = this single file dropped on a plain host with no server
const STATIC_HELP = "This copy of the page has no server behind it, so it can't do this. To get Google Calendar and real people on your own site, deploy the whole website kit (sloth-sync-web.zip), not just this one HTML file.";
const ICONS = {
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.5c2 .8 3.5 2.7 3.5 5.5"/>',
  bell:'<path d="M6 16V11a6 6 0 1112 0v5l1.5 2h-15z"/><path d="M10 21h4"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
  wand:'<path d="M5 19L17 7"/><path d="M15 5l4 4"/><path d="M6 4v3M4.5 5.5h3M19 15v3M17.5 16.5h3"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'
};
const ic = (n, s=20, c='') => `<svg class="${c}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

const members = [
  {id:'p', name:'Prabhat (you)', short:'PR', color:'#C98952', on:true},
];
let today = new Date();
const days = Array.from({length:366}, (_, i) => { const d = new Date(today); d.setDate(today.getDate() + i); return d; });
const DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const fmtLong = d => d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', ...(d.getFullYear() !== today.getFullYear() ? {year:'numeric'} : {})});

const CALS = [
  {id:'personal', name:'Personal', shared:false, bg:'var(--primary)', fg:'var(--primary-foreground)'},
  {id:'team', name:'Team', shared:true, bg:'var(--accent)', fg:'var(--accent-foreground)'},
  {id:'crew', name:'Weekend crew', shared:true, bg:'#9B7BA8', fg:'#FFFFFF'},
];
let SHARED = CALS.filter(c => c.shared);
const CAL_COLORS = ['#9B7BA8', '#6FA3A0', '#C4A15B', '#B97868', '#7D8FB3', '#8A9A5B'];
const defaultCal = () => (CALS.find(c => !c.google && c.shared) || CALS.find(c => !c.google) || CALS[0] || {}).id;
const calOf = id => CALS.find(c => c.id === id) || CALS.find(c => c.id === defaultCal()) || CALS[0] || {id:'none', name:'Calendar', bg:'var(--primary)', fg:'var(--primary-foreground)'};
let events = {
  0: [{t:'2:00 PM', title:'Weekly product sync', who:['PR'], c:'accent', cal:'team'}, {t:'6:00 PM', dur:'1 hr', title:'Gym', who:['PR'], c:'primary', cal:'personal'}],
  1: [{t:'10:30 AM', title:'Design review', who:['PR'], c:'primary', cal:'team'}, {t:'9:00 AM', dur:'1 hr', title:'Dentist', who:['PR'], c:'primary', cal:'personal'}],
  2: [{t:'7:00 PM', dur:'2 hrs', title:'Board game night', who:['PR'], c:'accent', cal:'crew'}],
  3: [{t:'11:00 AM', title:'Roadmap check-in', who:['PR'], c:'accent', cal:'team'}, {t:'6:30 PM', dur:'1 hr', title:'Call mom', who:['PR'], c:'primary', cal:'personal'}],
  4: [{t:'10:00 AM', dur:'2 hrs', title:'Brunch', who:['PR'], c:'accent', cal:'crew'}],
};
let notifs = [];
let prefs = {sync:true, quiet:false, notify:true};
let state = {tab:'home', day:0, sheet:null, step:-1, prop:0, lunchDone:false, pends:[], req:null, rejected:[], done:[], evd:null, real:{on:false, me:null, myName:'', names:{}, reqs:{}, seen:null, subs:{}, ui:{}, rp:null, cm:null, canWrite:null, invites:{}, inv:null, jn:null}, nf:{busy:false, result:'', frame:false}, ga:null, gpanel:false, cl:null, google:null, gl:null, nc:null, cx:null, vis:{personal:true, team:true, crew:true}, shortcuts:[
    {id:'s1', icon:'🍽️', title:'Team lunch', dur:'1 hr', span:1, win:'Midday', mode:'dur'},
    {id:'s2', icon:'☕', title:'Coffee chat', dur:'30 min', span:1, win:'Morning', mode:'dur'},
    {id:'s3', icon:'🔁', title:'Weekly sync', dur:'1 hr', span:1, win:'Afternoon', mode:'dur'},
    {id:'s4', icon:'🌙', title:'Overnight offsite', mode:'range', st:'9:30 PM', et:'9:00 AM', daysSpan:1}], cal:{view:'month', focus:new Date(today.getFullYear(), today.getMonth(), today.getDate()), fresh:true},
  invites:[]};
const dl = d => { const x = days[d]; if (!x) return ''; if (d < 7) return fmtLong(x).split(',')[0]; return x.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', ...(x.getFullYear() !== today.getFullYear() ? {year:'numeric'} : {})}); };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const offVal = o => ymd(days[Math.max(0, Math.min(days.length - 1, o))]);
const valOff = v => { const [y, m, d] = String(v).split('-').map(Number); if (!y || !m || !d) return null; return Math.max(0, Math.min(days.length - 1, Math.round((new Date(y, m - 1, d) - base) / 864e5))); };
const near = c => Array.from({length:60}, (_, i) => Math.max(0, c - 7) + i).filter(d => d < days.length);
const dateAttrs = () => `min="${offVal(0)}" max="${offVal(days.length - 1)}"`;
const monthOff = n => Math.round((new Date(today.getFullYear(), today.getMonth() + n, 1) - base) / 864e5);
const dr = (d, n = 1) => n > 1 ? `${dl(d)}–${dl(d + n - 1)}` : dl(d);
const fmtT = m => { let h = Math.floor(m / 60), mm = m % 60; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(mm).padStart(2, '0')} ${ap}`; };
const parseT = t => { const [a, ap] = t.split(' '); let [h, m] = a.split(':').map(Number); if (ap === 'PM' && h !== 12) h += 12; if (ap === 'AM' && h === 12) h = 0; return h * 60 + m; };
const durMin = d => d === '30 min' ? 30 : d === '2 hrs' ? 120 : 60;
const TIMES = Array.from({length:48}, (_, i) => fmtT(i * 30));
// Suggested start times per window, in minutes after midnight. :30 times are optional (r.half).
const SLOT_RANGES = {Morning:[0, 660], Midday:[720, 780], Afternoon:[840, 900], Evening:[960, 1380], Anytime:[480, 1380]};
function slotList(win, half) {
  const [a, b] = SLOT_RANGES[win] || SLOT_RANGES.Anytime, out = [];
  for (let m = a; m <= b + (half && win !== 'Morning' ? 30 : 0); m += half ? 30 : 60) out.push(m);
  if (win === 'Morning') out.sort((x, y) => (x >= 540 ? x : 1e5 - x) - (y >= 540 ? y : 1e5 - y)); // 9 AM first, then earlier hours
  return out.map(fmtT);
}
const SLOTS = {}; ['Morning', 'Midday', 'Afternoon', 'Evening', 'Anytime'].forEach(w => { SLOTS[w] = slotList(w, false); });
const lengthTxt = m => { const h = Math.floor(m / 60), mm = m % 60; return h ? `${h} hr${mm ? ' ' + mm + ' min' : ''}` : `${mm} min`; };
const overlap = (a, b) => a[0] < b[1] && b[0] < a[1];
const ivals = p => {
  if (p.custom) return [[p.s, p.e]];
  return Array.from({length:p.span || 1}, (_, k) => { const st = (p.day + k) * 1440 + parseT(p.time); return [st, st + durMin(p.dur)]; });
};
function freeIv(ivs, ignore) {
  if (ivs.some(v => v[1] > days.length * 1440)) return false;
  for (const d of Object.keys(events)) for (const ev of events[d]) {
    if (ev.free) continue;
    const st = (+d) * 1440 + parseT(ev.t), x = ev.s !== undefined ? [ev.s, ev.e] : [st, st + durMin(ev.dur)];
    if (ivs.some(v => overlap(v, x))) return false;
  }
  return !state.pends.some(p => p !== ignore && ivals(p).some(x => ivs.some(v => overlap(v, x))));
}
function slotFree(d, t, span, ignore, dur = '1 hr') {
  return freeIv(ivals({day:d, time:t, span, dur}), ignore);
}
function fitsPd(pd, d, t) {
  if (pd.custom) { const st = d * 1440 + parseT(t); return freeIv([[st, st + pd.e - pd.s]], pd); }
  return slotFree(d, t, pd.span || 1, pd, pd.dur);
}
const snap = pd => ({day:pd.day, time:pd.time, span:pd.span, custom:pd.custom, s:pd.s, e:pd.e});
const wt = (o, at) => o.custom ? `${dl(Math.floor(o.s / 1440))} ${fmtT(o.s % 1440)} – ${dl(Math.floor(o.e / 1440))} ${fmtT(o.e % 1440)}` : at ? `${dr(o.day, o.span)} at ${o.time}` : `${dr(o.day, o.span)} ${o.time}`;
function setStart(pd, d, t) { if (pd.custom) { const len = pd.e - pd.s; pd.s = d * 1440 + parseT(t); pd.e = pd.s + len; } pd.day = d; pd.time = t; }
function rangeUI(r) {
  const sel = 'rounded-2xl bg-muted px-3 py-3 text-sm font-semibold outline-none flex-1 min-w-0';
  const dsel = k => `<input type="date" data-rf="${k}" value="${offVal(r[k])}" ${dateAttrs()} class="${sel}" />`;
  const tsel = k => `<select data-rf="${k}" class="${sel}">${TIMES.map(t => `<option ${r[k] === t ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  const l = t => `<p class="text-xs font-bold text-muted-foreground uppercase tracking-wider mt-4 mb-2">${t}</p>`;
  return `${l('Starts')}<div class="flex gap-2">${dsel('sd')}${tsel('st')}</div>${l('Ends')}<div class="flex gap-2">${dsel('ed')}${tsel('et')}</div>`;
}
function resultWhen(r, p) {
  if (r.mode !== 'range') return `${resultWhen(r, p)}`;
  const k = p[2] || 0, st = r.s + k * 1440, en = r.e + k * 1440;
  return `<p class="font-extrabold">${fmtLong(days[Math.floor(st / 1440)])} · ${fmtT(st % 1440)}</p><p class="font-extrabold">to ${fmtLong(days[Math.floor(en / 1440)])} · ${fmtT(en % 1440)}</p><p class="text-sm font-bold text-primary mt-1">${lengthTxt(en - st)} in total</p>`;
}
const proposals = () => {
  const out = [], r = state.req;
  if (r.mode === 'range') {
    for (let k = 0; k < (r.ahead || 14) && r.e + k * 1440 <= days.length * 1440; k++) {
      const st = r.s + k * 1440, en = r.e + k * 1440, d = Math.floor(st / 1440);
      if (freeIv([[st, en]], null) && !state.rejected.includes(`${r.title}|${d}|${fmtT(st % 1440)}`)) out.push([d, fmtT(st % 1440), k]);
    }
    return out;
  }
  const lo = r.from || 0, hi = Math.min(days.length - 1, lo + (r.ahead || 14));
  for (let d = lo; d <= hi; d++) slotList(r.win, r.half).forEach(t => {
    const taken = !slotFree(d, t, r.span, null, r.dur) || state.rejected.includes(`${r.title}|${d}|${t}`);
    if (!taken) out.push([d, t]);
  });
  return out;
};

function avatar(m, extra='') {
  if (m.img) return `<span class="size-6 rounded-full overflow-hidden flex ring-2 ring-card ${extra}"><img src="${esc(m.img)}" alt="" class="size-6 object-cover" /></span>`;
  return `<span class="size-6 rounded-full text-[10px] font-extrabold flex items-center justify-center ring-2 ring-card text-white ${extra}" style="background:${m.color}">${m.init || m.short}</span>`;
}
const byShort = s => members.find(m => m.short === s);

function header() {
  const names = {home:'Slow morning, ' + (state.real.myName ? esc(state.real.myName.split(' ')[0]) : 'Prabhat'), groups:'Your group', calendar:'Calendar', status:'Confirmations', notifs:'Notifications', settings:'Settings'};
  const subs = {home:members.filter(m => m.on).length > 1 ? `${members.filter(m => m.on).length} people in sync.` : 'Just you for now.', groups:'Who joins scheduling', calendar:'Day, week, month and year', status:`${state.pends.length + state.invites.filter(i => i.status !== 'declined' && !inviteComplete(i)).length} in progress`, notifs:`${notifs.filter(n=>n.open).length + state.invites.filter(i=>i.status==='open').length} open`, settings:'Make it yours'};
  return `<header class="px-5 pt-8 pb-4 flex items-start justify-between">
    <div><p class="text-sm font-semibold text-muted-foreground tracking-wide">${fmtLong(today)}</p>
    <h1 class="text-3xl font-extrabold tracking-tight mt-1">${names[state.tab]}</h1>
    <p class="text-base text-muted-foreground mt-1">${subs[state.tab]}</p></div>
    <div class="size-14 rounded-full bg-accent/60 flex items-center justify-center border border-border text-3xl" aria-label="Sloth mascot">🦥</div></header>`;
}

const DEFAULT_SC = state.shortcuts.map(x => ({...x}));
const scMeta = sc => sc.mode === 'range' ? `${sc.st} → ${sc.et}` : `${sc.dur} · ${sc.win}${sc.span > 1 ? ' · ' + sc.span + ' days' : ''}`;
function shortcutsSection() {
  const cards = state.shortcuts.map(sc => `<div class="relative shrink-0">
